name: Run Mother Bot 24/7

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      is_handover:
        description: 'Internal zero-restart handover flag (true/false)'
        required: false
        default: 'false'
      is_manual_restart:
        description: 'Manual admin restart flag (true/false)'
        required: false
        default: 'false'
  schedule:
    # Backup safety net — fires every 30m ONLY if bot ever stops
    - cron: '*/30 * * * *'

# Only ONE bot instance ever runs at a time.
# Push / dispatch / handover cancels the older instance; schedule queues cleanly behind an active one.
concurrency:
  group: mother-bot-single-instance
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  actions: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cancel Any Other Running Instances
        env:
          GH_TOKEN: ${{ github.token }}
          PAT_TOKEN: ${{ secrets.PAT || secrets.WORKFLOW_TOKEN || secrets.GH_PAT }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - << 'PYEOF'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ.get('GITHUB_REPOSITORY', '')
          current_id = str(os.environ.get('CURRENT_RUN_ID', ''))
          tokens = [t.strip() for t in [os.environ.get('PAT_TOKEN', ''), os.environ.get('GH_TOKEN', '')] if t and t.strip()]
          if not repo or not tokens:
              print('No GitHub token available to check previous runners.')
              raise SystemExit(0)

          headers = {
              'Authorization': f'Bearer {tokens[0]}',
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'MotherBotRunner',
          }
          try:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs?per_page=15',
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=8) as resp:
                  data = json.load(resp)

              active_ids = []
              for r in data.get('workflow_runs', []):
                  r_id = str(r.get('id'))
                  r_num = r.get('run_number')
                  r_status = r.get('status')
                  if r_id != current_id and r_status in ('in_progress', 'queued', 'pending', 'waiting'):
                      active_ids.append((r_id, r_num))
                      try:
                          c_req = urllib.request.Request(
                              f'https://api.github.com/repos/{repo}/actions/runs/{r_id}/cancel',
                              method='POST',
                              headers=headers,
                          )
                          urllib.request.urlopen(c_req, timeout=8)
                          print(f'🛑 Cancelled run #{r_num} (id:{r_id}, was:{r_status})')
                      except Exception as e:
                          print(f'⚠️ Could not cancel run #{r_num}: {e}')

              if active_ids:
                  print(f'⏳ Waiting for {len(active_ids)} previous runner(s) to finish saving cache...')
                  for _ in range(18):
                      time.sleep(2)
                      still_running = []
                      for r_id, r_num in active_ids:
                          try:
                              chk = urllib.request.Request(
                                  f'https://api.github.com/repos/{repo}/actions/runs/{r_id}',
                                  headers=headers,
                              )
                              with urllib.request.urlopen(chk, timeout=6) as cr:
                                  cdata = json.load(cr)
                              if cdata.get('status') != 'completed':
                                  still_running.append((r_id, r_num))
                          except Exception:
                              pass
                      active_ids = still_running
                      if not active_ids:
                          print('✅ Previous runner(s) completed and saved cache.')
                          break
              else:
                  print('✅ No other active runners found.')
          except Exception as e:
              print(f'⚠️ Cancel check error: {e}')
          PYEOF

      - name: Restore Persistent Database from Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            mother_bot.db
            mother_bot.db-wal
            mother_bot.db-shm
            country_stocks
            bot_data.json
          key: mother-bot-persistent-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            mother-bot-persistent-

      - name: Clear Old Completed Workflow History
        env:
          GH_TOKEN: ${{ github.token }}
          PAT_TOKEN: ${{ secrets.PAT || secrets.WORKFLOW_TOKEN || secrets.GH_PAT }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - << 'PYEOF'
          import json
          import os
          import urllib.request

          repo = os.environ.get('GITHUB_REPOSITORY', '')
          current_id = str(os.environ.get('CURRENT_RUN_ID', ''))
          tokens = [t.strip() for t in [os.environ.get('PAT_TOKEN', ''), os.environ.get('GH_TOKEN', '')] if t and t.strip()]
          if not repo or not tokens:
              raise SystemExit(0)

          headers = {
              'Authorization': f'Bearer {tokens[0]}',
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'MotherBotCleaner',
          }
          try:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs?per_page=30',
                  headers=headers,
              )
              with urllib.request.urlopen(req, timeout=8) as resp:
                  runs = json.load(resp).get('workflow_runs', [])
              deleted = 0
              for r in runs:
                  r_id = str(r.get('id', ''))
                  if r_id == current_id or r.get('status') != 'completed':
                      continue
                  try:
                      dreq = urllib.request.Request(
                          f'https://api.github.com/repos/{repo}/actions/runs/{r_id}',
                          method='DELETE',
                          headers=headers,
                      )
                      urllib.request.urlopen(dreq, timeout=6)
                      deleted += 1
                  except Exception:
                      pass
              print(f'🧹 Cleared {deleted} old completed workflow run(s).')
          except Exception as e:
              print(f'⚠️ History cleanup skipped: {e}')
          PYEOF

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "python-telegram-bot>=22.0" "httpx>=0.27.0" "python-dotenv>=1.0.0" "tzdata>=2024.1"

      - name: Validate Required Secrets & Token
        id: validate
        env:
          MOTHER_BOT_TOKEN: ${{ secrets.MOTHER_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
        run: |
          python3 - << 'PYEOF'
          import json
          import os
          import urllib.error
          import urllib.request

          token = (os.environ.get('MOTHER_BOT_TOKEN') or '').strip()
          if not token:
              print('❌ ERROR: MOTHER_BOT_TOKEN secret is missing in GitHub Repository Secrets!')
              print('Go to GitHub Repo -> Settings -> Secrets and variables -> Actions -> New repository secret:')
              print('  Name: MOTHER_BOT_TOKEN')
              print('  Value: <your Mother Bot token from @BotFather>')
              raise SystemExit(1)

          try:
              with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=10) as resp:
                  data = json.load(resp)
              if not data.get('ok'):
                  print(f'❌ ERROR: Telegram rejected MOTHER_BOT_TOKEN: {data}')
                  raise SystemExit(1)
              uname = data.get('result', {}).get('username', 'unknown')
              print(f'✅ Verified MOTHER_BOT_TOKEN (@{uname})')
          except urllib.error.HTTPError as e:
              if e.code == 401:
                  print('❌ ERROR: MOTHER_BOT_TOKEN is INVALID or REVOKED (HTTP 401 Unauthorized).')
                  raise SystemExit(1)
              print(f'⚠️ Telegram API check returned HTTP {e.code} (continuing startup)')
          except Exception as e:
              print(f'⚠️ Telegram API pre-check skipped ({e})')

          if not (os.environ.get('ADMIN_USER_IDS') or '').strip():
              print('⚠️ WARNING: ADMIN_USER_IDS secret is empty — set your Telegram user ID in Repository Secrets!')
          else:
              print('✅ ADMIN_USER_IDS secret configured.')
          PYEOF

      - name: Run Unified Mother Bot
        id: run_bot
        env:
          MOTHER_BOT_TOKEN: ${{ secrets.MOTHER_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          OTP_BOT_TOKEN: ${{ secrets.OTP_BOT_TOKEN }}
          NUMBER_BOT_TOKEN: ${{ secrets.NUMBER_BOT_TOKEN }}
          ADMIN_USER_IDS: ${{ secrets.ADMIN_USER_IDS }}
          THIRDWAVE_API_KEY: ${{ secrets.THIRDWAVE_API_KEY }}
          THIRDWAVE_BASE_URL: ${{ secrets.THIRDWAVE_BASE_URL }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          SECONDARY_GROUP_CHAT_ID: ${{ secrets.SECONDARY_GROUP_CHAT_ID }}
          POLL_INTERVAL_SECONDS: ${{ secrets.POLL_INTERVAL_SECONDS || '7.5' }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN || secrets.PAT || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          PAT: ${{ secrets.PAT || secrets.WORKFLOW_TOKEN || secrets.GH_PAT || '' }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          STARTUP_TYPE: ${{ github.event.inputs.is_handover == 'true' && 'handover' || (github.event.inputs.is_manual_restart == 'true' && 'manual_restart' || 'fresh') }}
          DB_FILE: ${{ github.workspace }}/mother_bot.db
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          # Background cleaner every 180s so finished Actions logs stay tidy
          (
            while true; do
              sleep 180
              python3 - << 'CLEANEOF' >/dev/null 2>&1 || true
          import json, os, urllib.request
          repo = os.environ.get('GITHUB_REPOSITORY', '')
          cid = str(os.environ.get('CURRENT_RUN_ID', ''))
          tok = (os.environ.get('PAT') or os.environ.get('GH_TOKEN') or '').strip()
          if repo and tok:
              hdrs = {'Authorization': f'Bearer {tok}', 'Accept': 'application/vnd.github+json', 'User-Agent': 'MotherBotCleaner'}
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs?per_page=20', headers=hdrs)
              with urllib.request.urlopen(req, timeout=8) as resp:
                  for r in json.load(resp).get('workflow_runs', []):
                      rid = str(r.get('id', ''))
                      if rid != cid and r.get('status') == 'completed':
                          try:
                              urllib.request.urlopen(urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs/{rid}', method='DELETE', headers=hdrs), timeout=6)
                          except Exception:
                              pass
          CLEANEOF
            done
          ) &
          CLEANER_PID=$!

          BOT_PID=0
          STOP_REQUESTED=0
          cleanup() {
            STOP_REQUESTED=1
            if [ "$BOT_PID" -gt 0 ] 2>/dev/null; then
              kill -TERM "$BOT_PID" 2>/dev/null || true
              wait "$BOT_PID" 2>/dev/null || true
            fi
            kill "$CLEANER_PID" 2>/dev/null || true
          }
          trap cleanup SIGTERM SIGINT

          END_TIME=$((SECONDS + 19500))
          EXIT_CODE=0

          while [ $SECONDS -lt $END_TIME ] && [ $STOP_REQUESTED -eq 0 ]; do
            set +e
            python -u main.py &
            BOT_PID=$!
            wait "$BOT_PID"
            EXIT_CODE=$?
            set -e
            BOT_PID=0

            if [ $STOP_REQUESTED -eq 1 ] || [ $EXIT_CODE -eq 0 ]; then
              echo "✅ Mother Bot exited cleanly (code=$EXIT_CODE)."
              break
            elif [ $EXIT_CODE -eq 1 ]; then
              echo "❌ Fatal configuration error (exit code 1). Stopping workflow."
              break
            elif [ $EXIT_CODE -gt 128 ]; then
              echo "🛑 Stopped by signal (exit code=$EXIT_CODE)."
              break
            else
              echo "⚠️ Mother Bot crashed (exit code=$EXIT_CODE) — auto-restarting in 3s..."
              sleep 3
            fi
          done

          kill "$CLEANER_PID" 2>/dev/null || true
          echo "bot_exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ $EXIT_CODE -eq 1 ]; then
            exit 1
          fi

      - name: Pre-Save Database Checkpoint
        if: always()
        run: |
          python3 - << 'PYEOF'
          import glob
          import os
          import sqlite3

          dbs = []
          if os.path.exists('mother_bot.db'):
              dbs.append('mother_bot.db')
          dbs.extend(sorted(glob.glob(os.path.join('country_stocks', '*.db'))))

          for db_path in dbs:
              try:
                  conn = sqlite3.connect(db_path, timeout=10.0)
                  conn.execute('PRAGMA wal_checkpoint(TRUNCATE);')
                  conn.close()
              except Exception as e:
                  print(f'⚠️ WAL checkpoint skipped for {db_path}: {e}')
          print(f'✅ Checkpointed {len(dbs)} SQLite database file(s).')
          PYEOF

      - name: Save Persistent Database to Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            mother_bot.db
            mother_bot.db-wal
            mother_bot.db-shm
            country_stocks
            bot_data.json
          key: mother-bot-persistent-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Self-Trigger Next Run (Zero Downtime Handover)
        if: always() && !cancelled() && steps.validate.outcome == 'success' && steps.run_bot.outputs.bot_exit_code != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PAT_TOKEN: ${{ secrets.PAT || secrets.WORKFLOW_TOKEN || secrets.GH_PAT }}
          GIST_TOK: ${{ secrets.GIST_TOKEN }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - << 'PYEOF'
          import json
          import os
          import urllib.request

          repo = os.environ.get('GITHUB_REPOSITORY', '')
          current_id = str(os.environ.get('CURRENT_RUN_ID', ''))
          tokens = [t.strip() for t in [os.environ.get('PAT_TOKEN', ''), os.environ.get('GIST_TOK', ''), os.environ.get('GH_TOKEN', '')] if t and t.strip()]
          if not repo or not tokens:
              raise SystemExit(0)

          for tok in tokens:
              headers = {
                  'Authorization': f'Bearer {tok}',
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'MotherBotHandover',
              }
              try:
                  req = urllib.request.Request(
                      f'https://api.github.com/repos/{repo}/actions/runs?per_page=10',
                      headers=headers,
                  )
                  with urllib.request.urlopen(req, timeout=8) as resp:
                      runs = json.load(resp).get('workflow_runs', [])
                  already_queued = any(
                      str(r.get('id', '')) != current_id
                      and r.get('status') in ('queued', 'in_progress', 'pending', 'waiting')
                      for r in runs
                  )
                  if already_queued:
                      print('✅ Next Mother Bot workflow run is already queued/active.')
                      raise SystemExit(0)

                  payload = json.dumps({'ref': 'main', 'inputs': {'is_handover': 'true'}}).encode()
                  dreq = urllib.request.Request(
                      f'https://api.github.com/repos/{repo}/actions/workflows/run_bot.yml/dispatches',
                      data=payload,
                      method='POST',
                      headers={**headers, 'Content-Type': 'application/json'},
                  )
                  urllib.request.urlopen(dreq, timeout=10)
                  print('🚀 Dispatched replacement Mother Bot run_bot.yml workflow.')
                  raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as e:
                  print(f'⚠️ Dispatch attempt failed: {e}')
          PYEOF
